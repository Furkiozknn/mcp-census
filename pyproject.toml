[project]
name = "mcp-census"
version = "0.2.0"
description = "Resmî MCP Registry'nin yeniden üretilebilir sayımı: kaç sunucu var, kaçı denetlenebilir, kaçının kodu hiç yok."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furki Özkan" }]
keywords = ["mcp", "model-context-protocol", "registry", "census", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Bağımlılık yok, bilerek. Bu araç bir ölçüm aracı; ölçtüğü şeyden daha
# karmaşık olması ve kurulumunun kendisinin bir tedarik zinciri sorusu
# haline gelmesi anlamsız olurdu. Yalnızca standart kütüphane.
dependencies = []

[project.scripts]
mcp-census = "mcp_census.cli:main"

[project.urls]
Homepage = "https://github.com/Furkiozknn/mcp-census"
Changelog = "https://github.com/Furkiozknn/mcp-census/blob/master/CHANGELOG.md"
Issues = "https://github.com/Furkiozknn/mcp-census/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# hatchling 1.32 varsayilan olarak Metadata-Version 2.5 yaziyor; twine 7.0
# (ve onu kullanan pypa/gh-action-pypi-publish) bunu "gecersiz" diye
# reddediyor. 2.4 SPDX lisans alanini tasiyor ve her yerde okunuyor.
[tool.hatch.build.targets.wheel]
packages = ["mcp_census"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
