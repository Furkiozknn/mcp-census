[project]
name = "mcp-census"
version = "0.1.0"
description = "Resmî MCP Registry'nin yeniden üretilebilir sayımı: kaç sunucu var, kaçı denetlenebilir, kaçının kodu hiç yok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Furki Özkan" }]
keywords = ["mcp", "model-context-protocol", "registry", "census", "measurement"]

# Bağımlılık yok, bilerek. Bu araç bir ölçüm aracı; ölçtüğü şeyden daha
# karmaşık olması ve kurulumunun kendisinin bir tedarik zinciri sorusu
# haline gelmesi anlamsız olurdu. Yalnızca standart kütüphane.
dependencies = []

[project.scripts]
mcp-census = "mcp_census.cli:main"

[project.urls]
Homepage = "https://github.com/Furkiozknn/mcp-census"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_census"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
