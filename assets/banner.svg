<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="mcp-census - resmi MCP Registry'nin yeniden uretilebilir sayimi. Ayni uca sorulan ayni soru uc farkli sayi veriyor: 105.038 satir, 32.318 sunucu, 31.972 yayinda." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161c"/>
      <stop offset="55%" stop-color="#0e0d12"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2efe6"/>
      <stop offset="55%" stop-color="#e7dcc0"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a961" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- the same question asked three ways, drawn to scale -->
  <g transform="translate(640,58)">
    <text x="0" y="0" font-family="'Segoe UI', Verdana, sans-serif" font-size="12" letter-spacing="2.6" fill="#6b6b77">AYNI UÇ · AYNI GÜN · ÜÇ FARKLI SAYI</text>

    <g font-family="'Cascadia Code','Consolas',monospace">
      <rect x="0" y="18" width="470" height="22" rx="3" fill="#6cb6ff" opacity="0.85"/>
      <text x="8" y="34" font-size="13" fill="#0b0b0f">105.038</text>
      <text x="482" y="34" font-size="12.5" fill="#9a9aa6">satır</text>

      <rect x="0" y="52" width="145" height="22" rx="3" fill="#c9a961" opacity="0.9"/>
      <text x="8" y="68" font-size="13" fill="#0b0b0f">32.318</text>
      <text x="157" y="68" font-size="12.5" fill="#9a9aa6">ayrı sunucu</text>

      <rect x="0" y="86" width="143" height="22" rx="3" fill="#3fb950" opacity="0.9"/>
      <text x="8" y="102" font-size="13" fill="#0b0b0f">31.972</text>
      <text x="155" y="102" font-size="12.5" fill="#9a9aa6">hâlâ yayında</text>
    </g>

    <text x="0" y="136" font-family="'Segoe UI', Verdana, sans-serif" font-size="12.5" fill="#6b6b77">tek bir depo 1.177 satır üretiyor — sayfaları sayan ölçüm üç katını bildirir</text>
  </g>

  <text x="56" y="62" font-family="'Segoe UI', Verdana, sans-serif" font-weight="600" font-size="12" letter-spacing="4" fill="#c9a961" opacity="0.9">YENİDEN ÜRETİLEBİLİR SAYIM</text>

  <text x="54" y="122" font-family="'Cascadia Code','Consolas',monospace" font-size="44" fill="url(#title)">mcp-census</text>

  <text x="56" y="156" font-family="'Segoe UI', Verdana, sans-serif" font-size="16" fill="#c7c2b6">Resmî MCP Registry'nin yeniden üretilebilir sayımı.</text>
  <text x="56" y="180" font-family="'Segoe UI', Verdana, sans-serif" font-size="14.5" fill="#8d8d99">Ham veri, onu üreten kod ve her sayının tanımı — üçü birden.</text>

  <line x1="56" y1="200" x2="330" y2="200" stroke="url(#hair)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Verdana, sans-serif" font-size="12.5" fill="#6b6b77">
    <text x="56" y="226">bağımlılık 0 · Python 3.11+ · 44 test · MIT</text>
  </g>
</svg>
