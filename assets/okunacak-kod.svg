<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Registry'nin dortte birinin okunacak kodu yok: 32.318 sunucunun 7.439'unda repository alani hic yok (yuzde 23), 18.183'u yalnizca uzak uc sunuyor (yuzde 56,3), 425'i ne paket ne uzak uc bildiriyor (yuzde 1,3). Kaynak kodu olanlarin 24.841'i GitHub'da, 38'i GitLab'de.">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="340" rx="10" fill="url(#bg2)" stroke="#23232b"/>

  <text x="40" y="46" font-family="'Segoe UI', Verdana, sans-serif" font-weight="600" font-size="17" fill="#e7dcc0">"Kurmadan önce kodu oku" tavsiyesi kaç kayıt için geçerli?</text>
  <text x="40" y="70" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#8d8d99">16 Eylül 2026, resmî registry'nin tamamı · 32.318 ayrı sunucu</text>

  <!-- bars are drawn to scale: 640px = 32.318 servers -->
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="13">
    <g transform="translate(40,104)">
      <text x="0" y="-8" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#c7c2b6">repository alanı hiç yok — statik denetleyicinin söyleyebileceği hiçbir şey yok</text>
      <rect x="0" y="0" width="640" height="20" rx="3" fill="#1c1c24"/>
      <rect x="0" y="0" width="147" height="20" rx="3" fill="#f85149"/>
      <text x="656" y="15" fill="#f85149">7.439</text>
      <text x="716" y="15" fill="#6b6b77">%23,0</text>
    </g>

    <g transform="translate(40,168)">
      <text x="0" y="-8" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#c7c2b6">yalnızca uzak uç — okuyabildiğiniz kod, çalışan kod olmak zorunda değil</text>
      <rect x="0" y="0" width="640" height="20" rx="3" fill="#1c1c24"/>
      <rect x="0" y="0" width="360" height="20" rx="3" fill="#d29922"/>
      <text x="656" y="15" fill="#d29922">18.183</text>
      <text x="726" y="15" fill="#6b6b77">%56,3</text>
    </g>

    <g transform="translate(40,232)">
      <text x="0" y="-8" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#c7c2b6">ne paket ne uzak uç — kurulacak bir şey yok</text>
      <rect x="0" y="0" width="640" height="20" rx="3" fill="#1c1c24"/>
      <rect x="0" y="0" width="8" height="20" rx="3" fill="#8b949e"/>
      <text x="656" y="15" fill="#8b949e">425</text>
      <text x="706" y="15" fill="#6b6b77">%1,3</text>
    </g>
  </g>

  <line x1="40" y1="280" x2="960" y2="280" stroke="#23232b"/>
  <text x="40" y="306" font-family="'Segoe UI', Verdana, sans-serif" font-size="13" fill="#8d8d99">Kaynak kodu bildirenlerin neredeyse tamamı tek bir yerde: <tspan fill="#6cb6ff">GitHub 24.841</tspan> · <tspan fill="#6b6b77">GitLab 38</tspan></text>
</svg>
