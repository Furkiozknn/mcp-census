# Sayim, tek seferlik olmaktan cikip zaman serisine donuyor.
#
# veri/sayim.json 16 Eylul 2026'da olculdu ve o gunden beri registry'nin
# nereye gittigini kimse olcmedi. Bir sayim aracinin asil degeri tek bir
# sayida degil, o sayinin seyrinde: "kac sunucunun okunacak kodu yok"
# sorusunun cevabi artiyor mu, azaliyor mu?
#
# Ham kayitlar (105 bin satir) depoda durmuyor ve durmamali. Duran sey
# hesaplanmis sayim ve onun zaman serisi -- ikisi de kucuk, ikisi de
# ham veriden bagimsiz olarak anlamli.
#
# Indirme ~15 dakika suruyor (1051 sayfa), bu yuzden ayda bir. Elle de
# tetiklenebilir.

name: Sayim

on:
  schedule:
    # Ayin ilk gunu, 04:10 UTC. Indirme uzun surdugu icin gunun sakin saati.
    - cron: "10 4 1 * *"
  workflow_dispatch:
    inputs:
      azami_sayfa:
        description: "kac sayfa indirilsin (bos = hepsi; deneme icin 5 yazin -- deneme commit etmez)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sayim
  cancel-in-progress: false

jobs:
  say:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev

      # Girdi kabuga metin olarak GOMULMUYOR: `${{ }}` bir `run:` betiginin
      # icine yapistirilirsa, tetikleyenin yazdigi deger komut olarak calisir.
      # Deger ortam degiskeninden okunuyor ve once tamsayi mi diye bakiliyor.
      - name: Registry'yi indir
        id: indir
        env:
          AZAMI_SAYFA: ${{ inputs.azami_sayfa }}
        run: |
          set -euo pipefail
          if [ -z "${AZAMI_SAYFA:-}" ]; then
            uv run mcp-census --veri veri indir --sessiz
            echo "tam=true" >> "$GITHUB_OUTPUT"
          else
            case "$AZAMI_SAYFA" in
              ''|*[!0-9]*) echo "azami_sayfa pozitif bir tamsayi olmali: '$AZAMI_SAYFA'" >&2; exit 2 ;;
            esac
            uv run mcp-census --veri veri indir --sessiz --azami-sayfa "$AZAMI_SAYFA"
            echo "tam=false" >> "$GITHUB_OUTPUT"
          fi

      # Karsilastirma ONCEKI sayim ile yapiliyor: ham kayitlar depoda
      # olmadigi icin sunucu adi duzeyinde degil, olcut duzeyinde.
      - name: Onceki sayimi ayir
        run: cp veri/sayim.json "$RUNNER_TEMP/onceki-sayim.json"

      - name: Sayimi uret
        run: uv run mcp-census --veri veri say

      # Kismi bir deneme (azami_sayfa) seriye ve depoya GIRMEZ: 500 satirlik
      # bir sayim seride registry'nin bir ayda %99 kuculdugu gibi gorunurdu.
      # `mcp-census seri` kismi sayimi kendisi de reddediyor (cikis 2); bu
      # kosul ikinci kemer.
      - name: Onceki sayimla karsilastir ve seriye ekle
        if: steps.indir.outputs.tam == 'true'
        run: >-
          uv run mcp-census --veri veri seri
          --onceki "$RUNNER_TEMP/onceki-sayim.json"
          --ozet "$GITHUB_STEP_SUMMARY"

      - name: Deneme kosusu -- commit yok
        if: steps.indir.outputs.tam != 'true'
        run: |
          set -euo pipefail
          {
            echo "### Deneme kosusu (kismi indirme)"
            echo
            echo "Bu kosu depoya ve zaman serisine hicbir sey yazmadi."
            echo
            echo '```'
            uv run mcp-census --veri veri rapor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ham kayitlar commit EDILMIYOR: 105 bin satir, her ay yeniden.
      # Duran sey hesaplanmis sayim, manifest ve serinin bir satiri. Yeni
      # indirmenin zaman damgasi hep yeni oldugu icin tam bir kosu her ay
      # bir commit uretir -- sayilar oynamasa bile, "bu ay da olculdu ve
      # ayniydi" bilgisi serinin kendisidir.
      - name: Commit et
        if: steps.indir.outputs.tam == 'true'
        run: |
          set -euo pipefail
          git add veri/sayim.json veri/manifest.json veri/zaman-serisi.csv
          if git diff --cached --quiet; then
            echo "degisen dosya yok; commit yok"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: aylik sayim"
          # Indirme ~15 dk suruyor; bu arada dala baska bir commit gelmis
          # olabilir. Ustune al ve tekrar dene, zorla itme yok.
          for _ in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push 3 denemede basarisiz" >&2
          exit 1
