# Ayda bir, ekosistem basina TEK PR (groups). Her paket icin ayri PR,
# 25 Eylul 2026'da hesapta 36 acik Dependabot PR'i demekti; upload/download-
# artifact gibi birlikte yukselmesi gereken ciftler de ayni PR'da kalir.
# Kural: github.com/Furkiozknn/Furkiozknn schema/politika.py
# Calisma zamani bagimliligi yok; guncel kalmasi gereken sey is akislarindaki
# eylemler ve gelistirme kilidi (pytest). "uv" ekosistemi pyproject.toml ile
# uv.lock'u birlikte gunceller, boylece `uv sync --locked` kirilmaz.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      uv:
        patterns: ["*"]
