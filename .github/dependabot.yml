# Calisma zamani bagimliligi yok; guncel kalmasi gereken sey is akislarindaki
# eylemler ve gelistirme kilidi (pytest). "uv" ekosistemi pyproject.toml ile
# uv.lock'u birlikte gunceller, boylece `uv sync --locked` kirilmaz.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
